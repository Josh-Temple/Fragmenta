name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Browser startup smoke test
        run: |
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "Chromium/Chrome is required for the browser startup check" >&2
            exit 1
          fi
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          CHROME_BIN="$chrome" node scripts/browser-smoke.mjs

      - name: Verify deployed production in Chromium
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "Chromium/Chrome is required for production verification" >&2
            exit 1
          fi
          # Vercel may still be promoting the main deployment when Actions finishes.
          # Verify the public origin in a real browser, not merely a 200 response.
          for attempt in 1 2 3 4 5; do
            echo "Production browser verification attempt $attempt/5"
            if CHROME_BIN="$chrome" SMOKE_BASE_URL="https://fragmenta-brown.vercel.app" node scripts/browser-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          echo "Production browser smoke did not pass" >&2
          exit 1
