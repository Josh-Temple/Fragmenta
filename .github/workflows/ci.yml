name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Coalesce superseded updates to the same PR or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify generated pattern artifacts independently
        run: node scripts/pattern-artifacts.cjs

      - name: Verify all 18 IDs and emit a 36-output machine-readable manifest
        run: node scripts/pattern-manifest.cjs

      # Routine PR checks exercise the real built React UI without capturing
      # or uploading PNG files. Full visual evidence is an on-demand,
      # offline release-candidate activity (see PR #49 acceptance notes).
      - name: Browser startup smoke test (no image capture)
        timeout-minutes: 7
        run: |
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "Chromium/Chrome is required for the browser startup check" >&2
            exit 1
          fi
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          CHROME_BIN="$chrome" node scripts/browser-smoke.mjs

      # Production deployments are explicitly approved and manually triggered.
      # Do not verify an unrelated, older production SHA on each main push.
