<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fragmenta — Browser acceptance</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #171717; background: #e9e6de; font: 15px/1.6 system-ui, sans-serif; }
  header { padding: 16px 20px; background: white; border-bottom: 1px solid #888; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 6px 0; }
  form { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  select { min-height: 44px; padding: 8px; font: inherit; background: white; color: #171717; }
  select:focus-visible { outline: 3px solid #175b43; outline-offset: 3px; }
  main { padding: 20px; overflow: auto; }
  iframe { display: block; border: 0; background: white; box-shadow: 0 2px 12px #0003; }
  textarea { width: min(100%, 800px); min-height: 150px; font: 13px/1.5 monospace; }
</style>
<header>
  <h1>Fragmenta — ブラウザ受入確認</h1>
  <p>アプリ全体を指定サイズのiframe内で表示します。Android実機、タッチ入力、ブラウザの200%ズームを再現するものではありません。</p>
  <p id="revision"></p>
  <form>
    <label>表示サイズ<select id="viewport"><option value="360,800">360 × 800</option><option value="390,844" selected>390 × 844</option><option value="768,1024">768 × 1024</option><option value="1280,900">1280 × 900</option></select></label>
    <label>ページ<select id="route"><option value="/styles">Styles</option><option value="/">Home</option><option value="/browse">Browse</option><option value="/search?q=ガラス">Search</option><option value="/tools">Tools</option><option value="/tools/contrast">Contrast</option><option value="/tools/typography">Typography</option><option value="/licenses">Licenses</option></select></label>
    <label>確認対象<select id="source"><option value="candidate">このPreview</option><option value="production">現在の本番</option></select></label>
  </form>
</header>
<main>
  <iframe title="Fragmenta under test" id="app" width="390" height="844" src="./index.html#/styles"></iframe>
  <details><summary>コピーした全文の貼り付け確認</summary><label for="paste-target">クリップボードの確認欄（保存・送信しません）</label><p>通常の貼り付け操作で使います。コピー元の値をこの欄へ自動挿入する処理はありません。</p><textarea id="paste-target" spellcheck="false"></textarea></details>
</main>
<script>
  const frame = document.getElementById('app');
  const viewport = document.getElementById('viewport');
  const route = document.getElementById('route');
  const source = document.getElementById('source');
  const size = () => {
    const [width, height] = viewport.value.split(',').map(Number);
    frame.width = String(width); frame.height = String(height);
  };
  const navigate = () => { frame.src = (source.value === 'production' ? 'https://fragmenta-brown.vercel.app/' : './index.html') + '#' + route.value; };
  viewport.addEventListener('change', size);
  route.addEventListener('change', navigate);
  source.addEventListener('change', navigate);
  document.querySelector('form').addEventListener('submit', event => event.preventDefault());
  size();
</script>
</html>
